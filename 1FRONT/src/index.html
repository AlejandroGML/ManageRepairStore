<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Manage Repair Store</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=visibility_off" />
  <style>
    /* Boot splash: visible while the demo reset + app bootstrap run.
       Angular replaces <app-root> content when the app renders. */
    .boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #f8fafc;
      font-family: 'Fira Sans', 'Segoe UI', Roboto, sans-serif;
      color: #475569;
    }
    .boot-splash img { height: 48px; width: auto; }
    .boot-splash .boot-spinner {
      width: 26px;
      height: 26px;
      border: 3px solid #ddd6fe;
      border-top-color: #6d28d9;
      border-radius: 50%;
      animation: boot-spin 0.8s linear infinite;
    }
    .boot-splash p { margin: 0; font-size: 13.5px; letter-spacing: 0.02em; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      .boot-splash { background: #0f172a; color: #94a3b8; }
      .boot-spinner { border-color: #312a4a; border-top-color: #8b5cf6; }
    }
  </style>
</head>
<body class="mat-typography">
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
  <app-root>
    <div class="boot-splash" role="status" aria-label="Cargando demo">
      <img src="./assets/img/logo-300x80.png" alt="Manage Repair Store" />
      <div class="boot-spinner"></div>
      <p>Preparando el demo · Loading demo…</p>
    </div>
  </app-root>
</body>
</html>
