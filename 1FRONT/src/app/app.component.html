<div class="loading" *ngIf="isLoading">
    <mat-spinner color="warn"></mat-spinner>
</div>
<app-navbar [userLogged]="userLogged" (setLoggedEvent)="setLogged($event)"></app-navbar>
<main id="main-content">
  <app-form *ngIf="userLogged" [userLogged]="userLogged"></app-form>
  <app-login *ngIf="!userLogged" (setLoggedEvent)="setLogged($event)"></app-login>
  <router-outlet></router-outlet>
  <div aria-live="polite" aria-atomic="true" class="visually-hidden" id="announcer"></div>
</main>
<app-footer></app-footer>
