<h2 mat-dialog-title>{{ 'qr.title' | t }}</h2>

<mat-dialog-content class="qr-content">
  <p class="qr-hint">
    {{ 'qr.hint' | t }}
  </p>
  <div class="qr-host-wrap">
    <div #qrHost class="qr-host"></div>
  </div>
  <p class="qr-product mono">{{ productName }}</p>
  <p class="qr-data mono muted">{{ qrData }}</p>
</mat-dialog-content>

<mat-dialog-actions align="center">
  <button mat-button (click)="close()">{{ 'common.close' | t }}</button>
  <button mat-flat-button color="primary" (click)="download()">
    <mat-icon fontIcon="download"></mat-icon> {{ 'qr.download' | t }}
  </button>
</mat-dialog-actions>
