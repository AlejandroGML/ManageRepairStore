<h2 mat-dialog-title>{{ 'exists.title' | t }}</h2>
<mat-dialog-content>
  <div class="text-center">
    <mat-icon class="icon-ok">error_outline</mat-icon>
    <p>{{ 'exists.message' | t }}</p>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button class="btn btn-ghost" mat-dialog-close cdkFocusInitial [attr.aria-label]="'common.close' | t">{{ 'common.close' | t }}</button>
</mat-dialog-actions>
