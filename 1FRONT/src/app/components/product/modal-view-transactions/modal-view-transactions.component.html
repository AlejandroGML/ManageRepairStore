<h2 mat-dialog-title>
  <span class="tx-title">
    <img
      *ngIf="getImageUrl(data.product.image)"
      [src]="getImageUrl(data.product.image)"
      [alt]="data.product.name"
      class="tx-title-img"
    />
    {{ 'tx.title' | t:{ name: data.product.name } }}
  </span>
  <button class="dlg-close" (click)="close()" [attr.aria-label]="'common.close' | t">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content>
  <!-- Selector de columnas adicionales (chips MRS) -->
  <div class="col-picker">
    <span class="field-label">{{ 'tx.additionalColumns' | t }}</span>
    <div class="col-chips">
      <button
        type="button"
        class="chip"
        *ngFor="let c of optionalColumns"
        [class.active]="isSelected(c.value)"
        (click)="toggleColumn(c.value)">
        {{ c.labelKey | t }}
      </button>
    </div>
  </div>

  <div class="table-wrap">
    <table class="data zebra tx-table">
      <thead>
        <tr>
          <th *ngFor="let col of displayedColumns">{{ headerLabel(col) }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of data.transactions">
          <td *ngFor="let col of displayedColumns" [ngSwitch]="col">
            <img
              *ngSwitchCase="'image'"
              [src]="getImageUrl(t.snapshotData?.image)"
              [alt]="'tx.productImageAlt' | t"
              class="product-image" />
            <ng-container *ngSwitchCase="'createdAt'">{{ t.createdAt | date:'dd-MM-yyyy HH:mm:ss' }}</ng-container>
            <span
              *ngSwitchCase="'quantity'"
              class="mono"
              [class.qty-negative]="t.quantity < 0"
              [class.qty-positive]="t.quantity > 0"
            >{{ t.quantity > 0 ? '+' + t.quantity : t.quantity }}</span>
            <ng-container *ngSwitchDefault>{{ cellValue(t, col) }}</ng-container>
          </td>
        </tr>
        <tr *ngIf="!data.transactions?.length">
          <td [attr.colspan]="displayedColumns.length" class="empty-state">{{ 'tx.empty' | t }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="btn btn-ghost" (click)="close()">{{ 'common.close' | t }}</button>
</mat-dialog-actions>
