<h2 mat-dialog-title>
  <span>{{ 'categories.title' | t }}</span>
  <button class="dlg-close" (click)="close()" [attr.aria-label]="'common.close' | t">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content>
  <!-- Alta -->
  <div class="toolbar">
    <button class="btn btn-primary" *ngIf="!adding" (click)="startAdd()">
      <mat-icon fontIcon="add"></mat-icon> {{ 'categories.add' | t }}
    </button>
  </div>

  <div class="add-row" *ngIf="adding">
    <input
      class="input"
      [placeholder]="'categories.namePlaceholder' | t"
      [(ngModel)]="newName"
      (keyup.enter)="saveAdd()"
      maxlength="80" />
    <button class="btn btn-primary" [disabled]="saving || !newName.trim()" (click)="saveAdd()">
      <mat-icon fontIcon="check"></mat-icon>
    </button>
    <button class="btn btn-ghost" (click)="cancelAdd()">
      <mat-icon fontIcon="close"></mat-icon>
    </button>
  </div>

  <!-- Listado -->
  <div class="table-wrap">
    <table class="data zebra">
      <thead>
        <tr>
          <th>{{ 'categories.colCategory' | t }}</th>
          <th class="col-num">{{ 'categories.colProducts' | t }}</th>
          <th class="col-actions">{{ 'common.actions' | t }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of categories">
          <ng-container *ngIf="editingId !== c.id; else editCell">
            <td class="strong">{{ c.name }}</td>
            <td class="col-num mono">{{ c.productCount ?? 0 }}</td>
            <td class="col-actions">
              <button class="icon-btn" (click)="startEdit(c)" [matTooltip]="'common.edit' | t" [attr.aria-label]="'categories.editAriaLabel' | t">
                <mat-icon fontIcon="edit"></mat-icon>
              </button>
              <button class="icon-btn" (click)="confirmDelete(c)" [matTooltip]="'common.delete' | t" [attr.aria-label]="'categories.deleteAriaLabel' | t">
                <mat-icon fontIcon="delete"></mat-icon>
              </button>
            </td>
          </ng-container>
          <ng-template #editCell>
            <td colspan="3">
              <div class="edit-row">
                <input class="input" [(ngModel)]="editName" (keyup.enter)="saveEdit()" maxlength="80" />
                <button class="btn btn-primary" [disabled]="saving || !editName.trim()" (click)="saveEdit()">
                  <mat-icon fontIcon="check"></mat-icon> {{ 'common.save' | t }}
                </button>
                <button class="btn btn-ghost" (click)="cancelEdit()">{{ 'common.cancel' | t }}</button>
              </div>
            </td>
          </ng-template>
        </tr>
        <tr *ngIf="!categories.length && !loading">
          <td colspan="3" class="empty-state">{{ 'categories.empty' | t }}</td>
        </tr>
        <tr *ngIf="loading">
          <td colspan="3" class="empty-state">{{ 'categories.loading' | t }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="btn btn-ghost" (click)="close()">{{ 'common.close' | t }}</button>
</mat-dialog-actions>
