<h2 mat-dialog-title>Buscar Producto</h2>

<mat-dialog-content>
  <div>
    <mat-button-toggle-group [(ngModel)]="filterType" (change)="changeFilterType(filterType)">
      <mat-button-toggle value="id">ID</mat-button-toggle>
      <mat-button-toggle value="name">Nombre</mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <mat-form-field>
    <mat-label>Buscar Producto</mat-label>
    <input matInput [formControl]="searchControl" [placeholder]="filterType === 'id' ? 'Buscar por ID' : 'Buscar por Nombre'" />
  </mat-form-field>

  <mat-card class="table-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let product"> {{ product.id }} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let product"> {{ product.name }} </td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef> Stock </th>
        <td mat-cell *matCellDef="let product">
          <span [ngClass]="{'out-of-stock': isOutOfStock(product)}">
            {{ product.stock ?? 0 }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef> Seleccionar </th>
        <td mat-cell *matCellDef="let product">
          <button mat-button color="primary" (click)="selectProduct(product)" [disabled]="isOutOfStock(product)">
            Seleccionar
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Paginador para la tabla -->
    <mat-paginator [pageSize]="10"></mat-paginator>
  </mat-card>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button (click)="close()">Cerrar</button>
</mat-dialog-actions>
