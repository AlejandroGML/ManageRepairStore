<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Reposiciones de stock</h1>
      <p class="page-lead">Registra entradas de inventario</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" (click)="focusForm()">
        <mat-icon fontIcon="add"></mat-icon> Nueva reposición
      </button>
    </div>
  </div>

  <div class="refill-grid">
    <!-- Nueva entrada -->
    <div class="card new-entry" id="new-entry">
      <div class="card-head">
        <h2 class="card-title">Nueva entrada</h2>
      </div>
      <div class="entry-form">
        <label class="field-label" for="refill-product">Producto</label>
        <select id="refill-product" class="select" [(ngModel)]="selectedProductId" (ngModelChange)="onProductChange()">
          <option [ngValue]="null">Selecciona un producto...</option>
          <option *ngFor="let p of products" [ngValue]="p.id">{{ p.name }}</option>
        </select>

        <div class="entry-row">
          <div class="entry-field">
            <label class="field-label" for="refill-qty">Cantidad</label>
            <input id="refill-qty" class="input mono" type="number" min="1" placeholder="10" [(ngModel)]="quantity" />
          </div>
          <div class="entry-field">
            <label class="field-label" for="refill-cost">Costo unitario</label>
            <div class="currency-input">
              <span class="currency-prefix">$</span>
              <input id="refill-cost" class="input mono" type="number" min="0" [placeholder]="formatMoney(costPrice)" [(ngModel)]="costPrice" />
            </div>
          </div>
        </div>

        <div class="entry-row">
          <div class="entry-field">
            <label class="field-label" for="refill-provider">Proveedor</label>
            <input id="refill-provider" class="input" type="text" placeholder="Proveedor" [(ngModel)]="provider" />
          </div>
          <div class="entry-field">
            <label class="field-label" for="refill-invoice">N.º factura</label>
            <input id="refill-invoice" class="input mono" type="text" placeholder="FAC-1023" [(ngModel)]="invoice" />
          </div>
        </div>

        <button class="btn btn-accent btn-block entry-submit" [disabled]="submitting || !selectedProductId" (click)="registerEntry()">
          <mat-icon fontIcon="package_2"></mat-icon>
          <span>{{ submitting ? 'Registrando...' : 'Registrar entrada' }}</span>
        </button>
      </div>
    </div>

    <!-- Historial -->
    <div class="card history">
      <div class="card-head">
        <h2 class="card-title">Historial</h2>
      </div>
      <div class="table-wrap">
        <table class="data zebra">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Producto</th>
              <th class="col-num">Cant.</th>
              <th>Proveedor</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let h of history">
              <td class="mono muted">{{ h.date }}</td>
              <td>{{ h.product }}</td>
              <td class="col-num mono">+{{ h.qty }}</td>
              <td>{{ h.provider }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="empty-state" *ngIf="!history.length">Sin entradas registradas.</p>
    </div>
  </div>
</div>
