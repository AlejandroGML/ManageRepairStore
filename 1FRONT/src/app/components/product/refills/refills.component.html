<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Reposiciones de stock</h1>
      <p class="page-lead">Registra entradas de inventario y revisa el historial.</p>
    </div>
  </div>

  <div class="refill-grid">
    <!-- Nueva entrada -->
    <div class="card new-entry">
      <div class="card-head">
        <h2 class="card-title">Nueva entrada</h2>
      </div>
      <div class="entry-form">
        <label class="field-label" for="refill-product">Producto</label>
        <select id="refill-product" class="select" [(ngModel)]="selectedProductId" (ngModelChange)="onProductChange()">
          <option [ngValue]="null">Selecciona un producto...</option>
          <option *ngFor="let p of products" [ngValue]="p.id">{{ p.name }}</option>
        </select>

        <div class="entry-row">
          <div class="entry-field">
            <label class="field-label" for="refill-qty">Cantidad</label>
            <input id="refill-qty" class="input mono" type="number" min="1" [(ngModel)]="quantity" />
          </div>
          <div class="entry-field">
            <label class="field-label" for="refill-cost">Costo unitario</label>
            <input id="refill-cost" class="input mono" type="number" min="0" [(ngModel)]="costPrice" />
          </div>
        </div>

        <button class="btn btn-primary btn-block" [disabled]="submitting || !selectedProductId" (click)="registerEntry()">
          <mat-icon fontIcon="check_circle"></mat-icon>
          {{ submitting ? 'Registrando...' : 'Registrar entrada' }}
        </button>
      </div>
    </div>

    <!-- Historial -->
    <div class="card history">
      <div class="card-head">
        <h2 class="card-title">Historial</h2>
      </div>
      @if (history.length) {
        <div class="table-wrap">
          <table class="data zebra">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Producto</th>
                <th class="col-num">Cant.</th>
                <th class="col-num">Total</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let h of history">
                <td>{{ h.date }}</td>
                <td>{{ h.product }}</td>
                <td class="col-num"><span class="qty-pos mono">+{{ h.qty }}</span></td>
                <td class="col-num mono">{{ h.total | currency:'CLP':'symbol-narrow' }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      } @else {
        <p class="empty-state">Sin entradas registradas.</p>
      }
    </div>
  </div>
</div>
