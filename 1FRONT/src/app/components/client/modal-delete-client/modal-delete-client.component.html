<h2 mat-dialog-title>
  <span>Eliminar cliente</span>
  <button class="dlg-close" (click)="close()" aria-label="Cerrar">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content>
  <div class="delete-confirm">
    <mat-icon class="warn-icon" fontIcon="delete_forever" aria-hidden="true"></mat-icon>
    <p>
      ¿Está seguro que desea eliminar a <b>{{ client.name }}</b>
      y <b>todos sus registros</b>?
    </p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="center">
  <button class="btn btn-ghost" type="button" (click)="close()">Cancelar</button>
  <button class="btn btn-danger" type="button" (click)="deleteClient()">
    <mat-icon fontIcon="delete"></mat-icon> Eliminar
  </button>
</mat-dialog-actions>
