<h2 mat-dialog-title>
  <span>{{ title }}</span>
  @if (mode === 'confirm') {
    <button class="dlg-close" (click)="close()" [attr.aria-label]="'common.close' | t">
      <mat-icon>close</mat-icon>
    </button>
  }
</h2>

<mat-dialog-content class="confirm-content">
    <mat-icon class="icon-ok">check_circle_outline</mat-icon>
    <p class="confirm-message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="center">
  @if (mode === 'confirm') {
    <button class="btn btn-ghost" (click)="close()">{{ cancelLabel }}</button>
    <button class="btn btn-danger" (click)="confirm()">{{ okLabel }}</button>
  } @else {
    <button class="btn btn-soft" (click)="close()" cdkFocusInitial>{{ okLabel }}</button>
  }
</mat-dialog-actions>
