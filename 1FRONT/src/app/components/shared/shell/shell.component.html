<div class="shell" [class.sidebar-collapsed]="sidebarCollapsed">
  <aside class="sidebar" [class.open]="sidebarOpen">
    <div class="brand">
      <span class="brand-logo-wrap">
        <img class="brand-logo" src="assets/img/logo-300x80.png" alt="Manage Repair Store" />
      </span>
    </div>

    <nav class="nav" [attr.aria-label]="'shell.mainNav' | t">
      <ng-container *ngFor="let group of navGroups">
        <p class="nav-label" *ngIf="hasVisibleItems(group)">{{ group.label | t }}</p>
        <a
          *ngFor="let item of visibleItems(group)"
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [matTooltip]="sidebarCollapsed ? item.label : ''"
        >
          <mat-icon class="nav-icon" [fontIcon]="item.icon"></mat-icon>
          <span class="nav-text">{{ item.label | t }}</span>
          @if (badgeFor(item); as badge) {
            <span class="nav-badge">{{ badge }}</span>
          }
        </a>
      </ng-container>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <span class="user-avatar">{{ initials }}</span>
        <div class="user-meta">
          <strong>{{ displayName }}</strong>
          <span>{{ roleLabel }}</span>
        </div>
        <button class="logout-btn" (click)="logout()" [matTooltip]="'shell.logout' | t" [attr.aria-label]="'shell.logout' | t">
          <mat-icon fontIcon="logout"></mat-icon>
        </button>
      </div>
    </div>
  </aside>

  <div class="backdrop" *ngIf="sidebarOpen" (click)="sidebarOpen = false"></div>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" (click)="sidebarOpen = !sidebarOpen; sidebarCollapsed = false" [attr.aria-label]="'shell.menuOpen' | t" [matTooltip]="'shell.menu' | t">
        <mat-icon fontIcon="menu"></mat-icon>
      </button>
      <button class="collapse-btn" (click)="sidebarCollapsed = !sidebarCollapsed" [attr.aria-label]="'shell.menuCollapse' | t" [matTooltip]="'shell.menuCollapse' | t">
        <mat-icon [fontIcon]="sidebarCollapsed ? 'menu_open' : 'menu'"></mat-icon>
      </button>
      <div class="topbar-titles">
        <h1 class="topbar-title">{{ pageTitle | t }}</h1>
        <span class="topbar-sub">{{ pageSub | t }}</span>
      </div>
      <div class="topbar-actions">
        <button
          class="topbar-user"
          (click)="goProfile()"
          [matTooltip]="'shell.profile' | t"
          [attr.aria-label]="'shell.profile' | t"
        >
          <span class="topbar-user-avatar">{{ initials }}</span>
          <span class="topbar-user-meta">
            <strong>{{ displayName }}</strong>
            <span>{{ roleLabel }}</span>
          </span>
        </button>
        <button class="lang-toggle" (click)="toggleLang()" [matTooltip]="('login.language' | t) + ': ' + (i18n.lang() === 'en' ? 'English' : 'Español')" [attr.aria-label]="'login.language' | t">
          <mat-icon fontIcon="translate"></mat-icon>
          <span class="lang-label">{{ langLabel }}</span>
        </button>
        <app-theme-toggle></app-theme-toggle>
      </div>
    </header>

    <main class="content" id="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
