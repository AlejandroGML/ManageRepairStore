<h2 mat-dialog-title>
  <span>Cambiar estado</span>
  <button class="dlg-close" mat-dialog-close aria-label="Cerrar">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <div class="form-field-block">
      <label class="field-label" for="status-select">Estado</label>
      <select id="status-select" class="select" formControlName="status">
        <option value="Pendiente">Pendiente</option>
        <option value="En Revisión">En Revisión</option>
        <option value="Espera Resolución">Espera Resolución</option>
        <option value="Finalizado">Finalizado</option>
      </select>
      <span class="field-error" *ngIf="form.get('status')?.invalid">Debes seleccionar un estado</span>
    </div>

    <div class="form-field-block">
      <label class="field-label" for="input-comment">Comentario</label>
      <textarea id="input-comment" class="input textarea" formControlName="comment" rows="3"></textarea>
      <span class="field-error" *ngIf="form.get('comment')?.invalid">{{ obtenerMensajeError(form.get('comment')!) }}</span>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="btn btn-ghost" type="button" mat-dialog-close>Cerrar</button>
  <button class="btn btn-primary" type="button" (click)="changeStatus()">
    <mat-icon fontIcon="edit"></mat-icon> Aplicar
  </button>
</mat-dialog-actions>
