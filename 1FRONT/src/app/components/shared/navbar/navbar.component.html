<nav>
  <div class="navbar-container">
    <div class="navbar-logo">
      <a href="#">
        <img class="logo-img" src="assets/img/logo-300x80.png" alt="Logo Manage Repair Store">
      </a>
    </div>
    <app-theme-toggle></app-theme-toggle>
    <div class="navbar-actions" *ngIf="userLogged">
      <span class="user-email">{{ userLogged.email }}</span>
      <span *ngIf="userLogged?.role === 'admin'" role="button" tabindex="0" (click)="openAdminPanel()" (keydown.enter)="openAdminPanel()" (keydown.space)="openAdminPanel()" class="admin-link">Administración</span>
      <span role="button" tabindex="0" class="logout-btn" (click)="logout()" (keydown.enter)="logout()" (keydown.space)="logout()">Cerrar sesión</span>
    </div>
  </div>
</nav>
