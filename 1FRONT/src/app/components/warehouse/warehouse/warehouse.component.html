<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Bodega</h1>
      <p class="page-lead">Ubicaciones y niveles de stock por pasillo</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost btn-sm" (click)="reconcile()">
        <mat-icon fontIcon="sync"></mat-icon> Reconciliar
      </button>
    </div>
  </div>

  <!-- Resumen por pasillo -->
  <div class="aisle-grid" *ngIf="!loading">
    <div class="card kpi" *ngFor="let a of aisleCards">
      <div class="kpi-top">
        <span class="kpi-label">Pasillo {{ a.aisle }}</span>
        <span class="kpi-icon violet"><mat-icon fontIcon="shelves"></mat-icon></span>
      </div>
      <span class="kpi-value">{{ a.positions }} <span class="unit">posiciones</span></span>
      <span class="kpi-delta" [class]="a.deltaTone">
        <mat-icon [fontIcon]="a.deltaIcon"></mat-icon> {{ a.deltaText }}
      </span>
    </div>
  </div>

  <!-- Stock por ubicación -->
  <div class="card">
    <div class="card-head">
      <h2 class="card-title">Stock por ubicación</h2>
      <button class="btn btn-soft btn-sm" routerLink="/reposiciones">
        <mat-icon fontIcon="package_2"></mat-icon> Reponer stock
      </button>
    </div>
    <div class="table-wrap">
      <table class="data">
        <thead>
          <tr>
            <th>Ubicación</th>
            <th>Producto</th>
            <th class="col-num">Stock</th>
            <th class="col-num">Mínimo</th>
            <th>Nivel</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of stockRows">
            <td class="mono strong">{{ row.location }}</td>
            <td class="strong">{{ row.productName }}</td>
            <td class="col-num mono">{{ row.stock }}</td>
            <td class="col-num mono">{{ row.min }}</td>
            <td>
              <div class="stock-bar">
                <span [class]="row.tone" [style.width.%]="stockPct(row.stock, row.min)"></span>
              </div>
            </td>
            <td>
              <button class="btn btn-soft btn-sm" routerLink="/reposiciones">Reponer</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <p class="empty-state" *ngIf="!loading && !stockRows.length">Sin productos registrados.</p>
  </div>
</div>
