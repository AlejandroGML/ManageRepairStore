<div class="user-management-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Gestión de Usuarios</mat-card-title>
      <div class="header-actions">
        <button mat-raised-button color="primary" (click)="openCreateDialog()">
          <mat-icon>add</mat-icon> Nuevo Usuario
        </button>
        <button mat-icon-button (click)="close()" matTooltip="Cerrar" class="close-btn">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </mat-card-header>

    <mat-card-content>
      <div class="table-responsive"><table mat-table [dataSource]="users" class="user-table">
        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let user">{{ user.name }}</td>
        </ng-container>

        <!-- Role Column -->
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let user">{{ getRoleLabel(user.role) }}</td>
        </ng-container>

        <!-- Active Status Column -->
        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let user">
            <span *ngIf="user.active" class="activo-badge">Activo</span>
            <span *ngIf="!user.active" class="inactivo-badge">Inactivo</span>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let user">
            <button mat-icon-button color="primary" (click)="openEditDialog(user)" matTooltip="Editar usuario">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="openDeleteDialog(user)" matTooltip="Desactivar usuario">
              <mat-icon>block</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table></div>

      <div *ngIf="users.length === 0" class="empty-state">
        No hay usuarios registrados.
      </div>
    </mat-card-content>
  </mat-card>
</div>
