<div class="user-management-container">
  <div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Administración</h1>
      <p class="page-lead">Gestión de usuarios del sistema.</p>
    </div>
  </div>
<mat-card class="card">
    <div class="card-head">
      <h2 class="card-title">Gestión de Usuarios</h2>
      <div class="header-actions">
        <button class="btn btn-primary" (click)="openCreateDialog()"><mat-icon fontIcon="person_add"></mat-icon> Nuevo Usuario</button>
        <button *ngIf="dialogRef" mat-icon-button (click)="close()" matTooltip="Cerrar" class="close-btn">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <mat-card-content>
      <div class="table-responsive"><table mat-table [dataSource]="users" class="user-table">
        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let user">{{ user.name }}</td>
        </ng-container>

        <!-- Role Column -->
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let user">{{ getRoleLabel(user.role) }}</td>
        </ng-container>

        <!-- Active Status Column -->
        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let user">
            <span *ngIf="user.active" class="badge badge-success">Activo</span>
            <span *ngIf="!user.active" class="badge badge-error">Inactivo</span>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let user">
            <button mat-icon-button color="primary" (click)="openEditDialog(user)" matTooltip="Editar usuario">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="openDeleteDialog(user)" matTooltip="Desactivar usuario">
              <mat-icon>block</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table></div>

      <div *ngIf="users.length === 0" class="empty-state">
        No hay usuarios registrados.
      </div>
    </mat-card-content>
  </mat-card>
</div>
</div>
